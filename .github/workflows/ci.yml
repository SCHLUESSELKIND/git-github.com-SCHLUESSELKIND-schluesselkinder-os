name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Python: Inference Service ----------
  inference:
    name: Inference (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/soundsystem-inference

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/soundsystem-inference/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Run tests
        run: pytest --tb=short -q

      - name: Verify TS types drift check
        run: pytest tests/test_generated_types.py -v

  # ---------- TypeScript: Web App ----------
  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all packages)
        run: pnpm typecheck

      - name: Build web app
        run: pnpm --filter @schluesselkinder/web build
        env:
          NEXT_PUBLIC_INTERNAL_CONSOLE_ENABLED: "true"

  # ---------- TypeScript: API Service ----------
  api:
    name: API (typecheck + test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @schluesselkinder/api typecheck

      - name: Run tests
        run: pnpm --filter @schluesselkinder/api test
